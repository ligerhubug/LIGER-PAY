
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Login | LIGER-PAY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-container">

    <div class="auth-logo">
      <span class="logo">L</span>
      <h2>LIGER-PAY</h2>
      <p>Welcome back!</p>
    </div>

    <form id="loginForm" class="auth-card">

      <h2>Sign In</h2>
      <p>Access your LIGER-PAY account.</p>

      <label>Phone Number</label>
      <input
        type="tel"
        id="loginPhone"
        placeholder="e.g. 256700000000"
        required
      >

      <label>Password</label>
      <div class="password-field">
        <input
          type="password"
          id="loginPassword"
          placeholder="Enter your password"
          required
        >
        <button type="button" onclick="togglePassword('loginPassword', this)">Show</button>
      </div>

      <button type="submit" class="auth-button">Sign In</button>

      <p class="auth-note">
        New to LIGER-PAY?
        <a href="register.html">Create an account</a>
      </p>

      <a class="back-link" href="index.html">Back to Home</a>

    </form>

    <p class="demo-warning">DEMO VERSION — No real financial account.</p>

  </div>

  <script src="script.js"></script>
</body>
</html>
