
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIGER-PAY Receipt</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#101827;color:white;font-family:Arial,sans-serif}
.container{max-width:480px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.brand{color:#e3bd65;font-size:21px;font-weight:bold}
a{color:#e3bd65;text-decoration:none}
.receipt{background:white;color:#172235;border-radius:15px;padding:25px}
.logo{text-align:center;color:#b58a2d;font-size:26px;font-weight:900}
.subtitle{text-align:center;color:#667085;font-size:12px;margin-top:5px}
h2{text-align:center;font-size:20px;margin:25px 0 8px}
.demo{text-align:center;color:#a36b00;font-size:11px;font-weight:bold}
.line{border-top:1px dashed #aab2bd;margin:20px 0}
.row{display:flex;justify-content:space-between;gap:12px;margin:14px 0;font-size:13px}
.row span:first-child{color:#667085}
.row span:last-child{text-align:right;overflow-wrap:anywhere;font-weight:bold}
.total{text-align:center;font-size:24px;font-weight:bold;color:#9a741e;margin:22px 0}
.footer{text-align:center;color:#667085;font-size:12px;line-height:1.7}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
button{padding:14px 8px;border:0;border-radius:9px;font-weight:bold;font-size:13px}
.primary{background:#d5aa45;color:#101827}
.secondary{background:#293a52;color:white}
#message{color:#e3bd65;text-align:center;font-size:13px;margin-top:15px;line-height:1.5}
@media(max-width:350px){.actions{grid-template-columns:1fr}}
@media print{
body{background:white;padding:0;color:#172235}
header,.actions,#message{display:none!important}
.container{max-width:100%;margin:0}
.receipt{border-radius:0}
}
</style>
</head>
<body>
<div class="container">

<header>
<div class="brand">LIGER-PAY</div>
<a href="history.html">← History</a>
</header>

<div class="receipt" id="receiptArea">
<div class="logo">LIGER-PAY</div>
<div class="subtitle">PAY SMART. MOVE MONEY.</div>

<h2>TRANSACTION RECEIPT</h2>
<div class="demo">DEMO RECEIPT — NOT PROOF OF PAYMENT</div>
<div class="line"></div>

<div id="receiptDetails"></div>

<div class="line"></div>
<div class="total" id="receiptAmount">UGX 0</div>

<div class="footer">
Thank you for using LIGER-PAY.<br>
This is a locally generated demonstration record.<br>
It does not confirm that real money was received or sent.
</div>
</div>

<div class="actions">
<button class="secondary" onclick="goBack()">Back to History</button>
<button class="primary" onclick="downloadReceipt()">Download PDF</button>
<button class="secondary" onclick="shareReceipt()">Share Receipt</button>
<button class="primary" onclick="printReceipt()">Print Receipt</button>
</div>

<div id="message"></div>
</div>

<script>
let receipt=null;

function addRow(label,value){
const row=document.createElement("div");
row.className="row";

const left=document.createElement("span");
left.textContent=label;

const right=document.createElement("span");
right.textContent=value;

row.appendChild(left);
row.appendChild(right);

document.getElementById("receiptDetails").appendChild(row);
}

function money(n){
return "UGX "+Number(n||0).toLocaleString("en-UG");
}

function notify(text){
document.getElementById("message").textContent=text;
}

function goBack(){
window.location.href="history.html";
}

try{
const raw=sessionStorage.getItem("ligerSelectedReceipt");
if(raw){
receipt=JSON.parse(raw);
}
}catch(e){
receipt=null;
}

if(!receipt){
notify("No transaction selected. Return to transaction history and select a receipt.");
}else{
const names={
deposit:"Wallet Deposit",
withdrawal:"Wallet Withdrawal",
transfer:"Money Transfer"
};

addRow("Transaction Type",names[receipt.type]||"Transaction");
addRow("Reference",receipt.reference||"Not available");
addRow("Date",receipt.date?new Date(receipt.date).toLocaleString():"Not available");
addRow("Status",receipt.status||"DEMO RECORD");

if(receipt.recipient)addRow("Recipient",receipt.recipient);
if(receipt.note)addRow("Description",receipt.note);

document.getElementById("receiptAmount").textContent=money(receipt.amount);
}

function downloadReceipt(){
if(!receipt){
notify("No receipt is available.");
return;
}

const title="LIGER-PAY TRANSACTION RECEIPT";

const rows=[
["Transaction",receipt.type||"Transaction"],
["Reference",receipt.reference||""],
["Date",receipt.date?new Date(receipt.date).toLocaleString():""],
["Status",receipt.status||"DEMO RECORD"],
["Amount",money(receipt.amount)],
["Recipient",receipt.recipient||"Not applicable"],
["Description",receipt.note||"Not provided"]
];

const safe=value=>String(value).replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));

const html=`<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${title}</title>
<style>
body{font-family:Arial,sans-serif;padding:25px;color:#172235}
h1{text-align:center;color:#a37c25}
h2{text-align:center}
table{width:100%;border-collapse:collapse;margin-top:25px}
td{padding:12px;border-bottom:1px solid #ddd}
td:first-child{color:#667085}
.amount{text-align:center;font-size:25px;font-weight:bold;margin:30px}
.note{text-align:center;color:#a36b00;font-size:12px}
</style>
</head>
<body>
<h1>LIGER-PAY</h1>
<h2>TRANSACTION RECEIPT</h2>
<p class="note">DEMO RECEIPT — NOT PROOF OF PAYMENT</p>
<table>
${rows.map(r=>`<tr><td>${safe(r[0])}</td><td>${safe(r[1])}</td></tr>`).join("")}
</table>
<div class="amount">${safe(money(receipt.amount))}</div>
<p style="text-align:center">Thank you for using LIGER-PAY.</p>
<p class="note">This is a simulated transaction record. No real money moved.</p>
</body>
</html>`;

const blob=new Blob([html],{type:"text/html"});
const url=URL.createObjectURL(blob);
const link=document.createElement("a");

link.href=url;
link.download="LIGER-PAY-Receipt-"+(receipt.reference||"demo")+".html";

document.body.appendChild(link);
link.click();
link.remove();

setTimeout(()=>URL.revokeObjectURL(url),3000);

notify("Receipt document downloaded. Open it in your browser, then choose Print or Save as PDF.");
}

async function shareReceipt(){
if(!receipt){
notify("No receipt is available.");
return;
}

const text=
"LIGER-PAY DEMO RECEIPT\n"+
"Reference: "+receipt.reference+
"\nAmount: "+money(receipt.amount)+
"\nStatus: "+(receipt.status||"DEMO RECORD")+
"\nThis is not proof of real payment.";

try{
if(navigator.share){
await navigator.share({
title:"LIGER-PAY Receipt",
text:text
});
}else if(navigator.clipboard){
await navigator.clipboard.writeText(text);
notify("Receipt details copied. You can paste and share them.");
}else{
notify("Sharing is not supported in this preview.");
}
}catch(e){
notify("Sharing was cancelled or is unavailable.");
}
}

function printReceipt(){
if(!receipt){
notify("No receipt is available.");
return;
}

try{
window.print();
notify("If nothing happens, download the receipt document and open it in your browser.");
}catch(e){
notify("Printing is not supported in this preview. Download the receipt instead.");
}
}
</script>

<!-- Account protection -->
<script src="security.js"></script>

</body>
</html>
